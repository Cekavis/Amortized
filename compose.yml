services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amortized}
      POSTGRES_USER: ${POSTGRES_USER:-amortized}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://amortized:replace-with-a-local-secret@postgres:5432/amortized?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-secure-random-secret}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${AUTH_SECRET:-replace-with-a-secure-random-secret}
      NEXTAUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Amortized}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      APP_DEFAULT_CURRENCY: ${APP_DEFAULT_CURRENCY:-CNY}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
